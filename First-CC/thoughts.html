<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thoughts and reflections on language, literature, and life by an English major at TUST">
  <title>Thoughts · 随想</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-brand">
        <a href="index.html">L · K</a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html" data-page="home">Home</a></li>
        <li><a href="about.html" data-page="about">About</a></li>
        <li><a href="thoughts.html" data-page="thoughts">Thoughts</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <div class="container">
      <h1>Thoughts & Reflections</h1>
      <p class="subtitle">随想 · Essays on Language, Literature & Life</p>
    </div>
  </header>

  <!-- Filter & Search -->
  <section class="section-sm" style="padding-top: 0;">
    <div class="container-wide">
      <!-- Category Filters -->
      <div class="filter-bar" id="filter-bar">
        <!-- Rendered by JS -->
      </div>

      <!-- Search -->
      <div class="search-box">
        <input
          type="text"
          id="search-input"
          placeholder="Search thoughts... 搜索文章..."
          aria-label="Search thoughts"
        >
        <button id="search-btn">Search</button>
      </div>

      <!-- Posts Grid -->
      <div class="posts-grid" id="posts-grid">
        <!-- Rendered by JS -->
      </div>

      <!-- No Results Message -->
      <div class="no-results" id="no-results" style="display: none;">
        <p>No matching thoughts found.</p>
        <p style="font-size: 0.9rem;">没有找到匹配的文章。试试其他关键词吧。</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <p class="footer-quote">"Words are, in my not-so-humble opinion, our most inexhaustible source of magic." — Albus Dumbledore</p>
    <p class="footer-info">
      天津科技大学 · <span>外国语学院 英语系</span> · 2025–2029
    </p>
  </footer>

  <script src="js/posts.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function() {
      let currentCategory = 'all';
      let currentQuery = '';

      const filterBar = document.getElementById('filter-bar');
      const postsGrid = document.getElementById('posts-grid');
      const noResults = document.getElementById('no-results');
      const searchInput = document.getElementById('search-input');
      const searchBtn = document.getElementById('search-btn');

      // Render filter buttons
      function renderFilters() {
        const categories = getAllCategories();
        const labels = {
          all: 'All · 全部',
          language: 'Language · 语言',
          literature: 'Literature · 文学',
          life: 'Life · 生活'
        };

        filterBar.innerHTML = categories.map(cat =>
          `<button class="filter-btn${cat === currentCategory ? ' active' : ''}" data-category="${cat}">
            ${labels[cat] || cat}
          </button>`
        ).join('');

        // Bind click events
        filterBar.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            currentCategory = btn.dataset.category;
            currentQuery = '';
            searchInput.value = '';
            renderFilters();
            renderPosts();
          });
        });
      }

      // Render posts
      function renderPosts() {
        let results;
        if (currentQuery) {
          results = searchPosts(currentQuery);
          // Also filter by category if not 'all'
          if (currentCategory !== 'all') {
            results = results.filter(p => p.category === currentCategory);
          }
        } else {
          results = getPostsByCategory(currentCategory);
        }

        if (results.length === 0) {
          postsGrid.innerHTML = '';
          noResults.style.display = 'block';
        } else {
          noResults.style.display = 'none';
          postsGrid.innerHTML = results.map(renderPostCard).join('');

          // Re-trigger scroll animations
          setTimeout(() => {
            document.querySelectorAll('.fade-up').forEach(el => {
              const rect = el.getBoundingClientRect();
              if (rect.top < window.innerHeight) {
                el.classList.add('visible');
              }
            });
          }, 100);
        }
      }

      // Search handler
      function handleSearch() {
        currentQuery = searchInput.value;
        currentCategory = 'all';
        renderFilters();
        renderPosts();
      }

      searchBtn.addEventListener('click', handleSearch);
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleSearch();
      });

      // Initial render
      renderFilters();
      renderPosts();
    })();
  </script>
</body>
</html>
