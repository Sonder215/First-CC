  <script>
    /* =========================================================
       DeepSeek API 配置
       ⚠️ 按需求写死为空字符串：使用时请在此填入你的 API Key
       ========================================================= */
    const API_KEY = "sk-29a745570027465aaee82ddae40d6056";
    const API_URL = "https://api.deepseek.com/chat/completions";
    const MODEL = "deepseek-chat";

    /* =========================================================
       0. 星空粒子系统（与主页一致的深蓝星空 + 偶发流星）
       ========================================================= */
    (function initStarfield() {
      const canvas = document.getElementById('starfield-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d', { alpha: true });
      if (!ctx) return;

      let cssW = 0, cssH = 0, dpr = 1;
      const stars = [];
      const STAR_COUNT = 200;
      let time = 0;
      let meteor = null;

      function resize() {
        dpr = Math.max(1, window.devicePixelRatio || 1);
        cssW = window.innerWidth;
        cssH = window.innerHeight;
        canvas.width = Math.floor(cssW * dpr);
        canvas.height = Math.floor(cssH * dpr);
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function spawnStar() {
        const depth = Math.random(); // 0 近 → 1 远
        return {
          x: Math.random() * cssW,
          y: Math.random() * cssH,
          z: depth,
          r: (1 - depth) * 1.8 + 0.3,
          baseAlpha: 0.35 + (1 - depth) * 0.55,
          twinkleSpeed: 0.5 + Math.random() * 2.2,
          twinklePhase: Math.random() * Math.PI * 2,
          vx: (Math.random() - 0.5) * (0.04 + (1 - depth) * 0.12),
          vy: 0.015 + (1 - depth) * 0.06 + Math.random() * 0.03,
          hue: Math.random() < 0.18 ? 270 + Math.random() * 40 : 200 + Math.random() * 40
        };
      }

      function spawnMeteor() {
        meteor = {
          x: cssW * (0.2 + Math.random() * 0.6),
          y: cssH * Math.random() * 0.3,
          vx: 3 + Math.random() * 2.5,
          vy: 1.8 + Math.random() * 1.8,
          life: 1
        };
      }

      function draw() {
        time += 0.016;
        ctx.clearRect(0, 0, cssW, cssH);

        // 轻微紫色雾感
        const fog = ctx.createRadialGradient(
          cssW * 0.5, cssH * 0.35, 0,
          cssW * 0.5, cssH * 0.5, Math.max(cssW, cssH) * 0.75
        );
        fog.addColorStop(0, 'rgba(70, 40, 140, 0.12)');
        fog.addColorStop(0.55, 'rgba(20, 30, 90, 0.06)');
        fog.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = fog;
        ctx.fillRect(0, 0, cssW, cssH);

        // 星星
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.x += s.vx;
          s.y += s.vy;

          if (s.y > cssH + 4) { s.y = -4; s.x = Math.random() * cssW; }
          if (s.x < -4) s.x = cssW + 4;
          if (s.x > cssW + 4) s.x = -4;

          const twinkle = 0.55 + 0.45 * Math.sin(time * s.twinkleSpeed + s.twinklePhase);
          const alpha = Math.max(0.08, Math.min(1, s.baseAlpha * twinkle));

          if (s.r > 1.1) {
            const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4);
            glow.addColorStop(0, `hsla(${s.hue}, 90%, 85%, ${alpha * 0.55})`);
            glow.addColorStop(0.4, `hsla(${s.hue}, 80%, 70%, ${alpha * 0.18})`);
            glow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.fillStyle = glow;
            ctx.arc(s.x, s.y, s.r * 4, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.beginPath();
          ctx.fillStyle = `hsla(${s.hue}, 90%, 92%, ${alpha})`;
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 偶发流星
        if (!meteor && Math.random() < 0.004) spawnMeteor();
        if (meteor) {
          meteor.x += meteor.vx;
          meteor.y += meteor.vy;
          meteor.life -= 0.018;

          if (meteor.life <= 0 || meteor.x > cssW || meteor.y > cssH) {
            meteor = null;
          } else {
            const tailLen = 90;
            const headX = meteor.x, headY = meteor.y;
            const tailX = headX - meteor.vx * 14;
            const tailY = headY - meteor.vy * 14;
            const g = ctx.createLinearGradient(headX, headY, tailX, tailY);
            g.addColorStop(0, `rgba(255, 255, 255, ${0.9 * meteor.life})`);
            g.addColorStop(0.4, `rgba(180, 210, 255, ${0.5 * meteor.life})`);
            g.addColorStop(1, 'rgba(120, 100, 255, 0)');
            ctx.beginPath();
            ctx.strokeStyle = g;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.moveTo(headX, headY);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();

            const glow = ctx.createRadialGradient(headX, headY, 0, headX, headY, 8);
            glow.addColorStop(0, `rgba(255, 255, 255, ${0.95 * meteor.life})`);
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.beginPath();
            ctx.fillStyle = glow;
            ctx.arc(headX, headY, 8, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        requestAnimationFrame(draw);
      }

      resize();
      for (let i = 0; i < STAR_COUNT; i++) stars.push(spawnStar());
      window.addEventListener('resize', () => {
        resize();
        while (stars.length < STAR_COUNT) stars.push(spawnStar());
      });
      requestAnimationFrame(draw);
    })();

    /* =========================================================

    (function initTabs() {
      const btns = document.querySelectorAll('.tab-btn');
      const panels = {

        overseas: document.getElementById('panel-overseas')
      };

      btns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          btns.forEach(function (b) {

          });
          Object.keys(panels).forEach(function (key) {
            panels[key].style.display = key === btn.dataset.tab ? '' : 'none';
          });
        });
      });
    })();

    /* =========================================================
       3. DeepSeek API 调用
       ========================================================= */
    async function callDeepSeek(systemPrompt, userPrompt) {
      if (!API_KEY) {
        throw new Error('⚠️ API 密钥为空：请在 marketing.html 中找到 const API_KEY = ""，填入你的 DeepSeek API Key 后再试。');
      }

      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + API_KEY
        },
        body: JSON.stringify({
          model: MODEL,
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: userPrompt }
          ],
          temperature: 1.0,
          max_tokens: 2048,
          stream: false
        })
      });

      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        const msg = (data.error && data.error.message) || ('HTTP ' + res.status);
        throw new Error('DeepSeek API 调用失败：' + msg);
      }

      const content = data.choices &&
                      data.choices[0] &&
                      data.choices[0].message &&
                      data.choices[0].message.content;
      if (!content) throw new Error('DeepSeek API 返回内容为空，请重试。');
      return content;
    }

    'IMPORTANT PLATFORM RULES: LinkedIn must be professional, avoid excessive exclamation marks, use business English. Amazon must be highly conversion-focused, avoid slang. Instagram must be visually evocative. TikTok must be short and punchy. Facebook must encourage community discussion.',

    /* =========================================================
       5. 结果解析与渲染
       ========================================================= */
    const TITLE_EMOJI = {
      '种草文案': '📝',
      '关键词标签': '🏷️',
      '互动引导': '💬',
      'ENGLISH COPY': '✍️',
      'CULTURAL CONTEXT': '🌍',
      'HASHTAGS': '#️⃣',
      'CTA': '🎯'
    };

    // 将模型输出按【标题】标记拆分为多个部分
    function parseSections(raw) {
      const re = /【([^】]+)】/g;
      const matches = Array.from(raw.matchAll(re));
      if (!matches.length) return [{ title: '', content: raw.trim() }];

      const sections = [];
      matches.forEach(function (m, i) {
        const end = i + 1 < matches.length ? matches[i + 1].index : raw.length;
        const content = raw.slice(m.index + m[0].length, end).trim();
        if (content) sections.push({ title: m[1].trim(), content: content });
      });
      return sections.length ? sections : [{ title: '', content: raw.trim() }];
    }

    function makeEl(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text != null) el.textContent = text;
      return el;
    }

    // 在正文中提取 CTA 按钮文案（格式：Button: "xxx"）
    function extractCtaButton(content) {
      const re = /button\s*[:：]\s*["“'「]?([^"”'」\n\r]+)/i;
      const m = content.match(re);
      return m ? m[1].trim() : null;
    }

    function renderSection(sec) {
      const card = makeEl('div', 'result-section');
      const title = (TITLE_EMOJI[sec.title] || '✦') + ' ' + (sec.title || '文案内容');
      card.appendChild(makeEl('h4', null, title));

      const isHashtag = /hashtag|标签/i.test(sec.title);
      const isCta = /^\s*cta\b/i.test(sec.title);

      if (isHashtag) {
        // 标签渲染为 chips
        const tagRe = /#[\w一-龥_\-]+/g;
        const tags = sec.content.match(tagRe);
        if (tags && tags.length) {
          const row = makeEl('div', 'chip-row');
          tags.forEach(function (t) { row.appendChild(makeEl('span', 'chip', t)); });
          card.appendChild(row);
        }
        // 其余文字照常显示
        const rest = sec.content.replace(tagRe, '').trim();
        if (rest) card.appendChild(makeEl('div', 'result-body', rest));
      } else if (isCta) {
    const btnLabel = extractCtaButton(sec.content);
    const rest = sec.content.replace(/button\s*:\s*["']?([^"'\n\r]+)["']?/gi, '').trim();
    if (rest) card.appendChild(makeEl('div', 'result-body', rest));
    
    // 获取用户填写的产品链接
    const linkInput = document.getElementById('product-link-input');
    let productLink = linkInput ? linkInput.value.trim() : '';

    // 如果用户没有填链接，默认跳转到亚马逊首页
    if (!productLink) {
        productLink = 'https://www.amazon.com';
    }

    if (btnLabel) {
        // 创建可点击的按钮
        const ctaBtn = makeEl('a', 'cta-preview', btnLabel);
        ctaBtn.href = productLink;
        ctaBtn.target = '_blank';
        ctaBtn.style.display = 'inline-block';
        ctaBtn.style.padding = '12px 24px';
        ctaBtn.style.background = 'linear-gradient(90deg, #E6529F, #F66941)';
        ctaBtn.style.color = 'white';
        ctaBtn.style.borderRadius = '30px';
        ctaBtn.style.textDecoration = 'none';
        ctaBtn.style.fontWeight = 'bold';
        card.appendChild(ctaBtn);

        // 创建复制链接按钮（解决国内无法跳转外网的问题）
        const copyBtn = makeEl('button', 'cta-preview', '复制链接');
        copyBtn.style.marginLeft = '10px';
        copyBtn.style.padding = '8px 12px';
        copyBtn.style.borderRadius = '20px';
        copyBtn.style.border = '1px solid rgba(255,255,255,0.3)';
        copyBtn.style.background = 'rgba(255,255,255,0.1)';
        copyBtn.style.color = 'rgba(255,255,255,0.9)';
        copyBtn.style.cursor = 'pointer';
        copyBtn.onclick = function() {
            navigator.clipboard.writeText(productLink);
        };
        card.appendChild(copyBtn);
    }
} else {
    card.appendChild(makeEl('div', 'result-body', sec.content));
}

      return card;
    }

    function renderResult(container, raw) {
      container.innerHTML = '';

      // 工具条：复制按钮
      const toolbar = makeEl('div', 'output-toolbar');
      const copyBtn = makeEl('button', 'copy-btn', '📋 复制文案');
      copyBtn.type = 'button';
      copyBtn.addEventListener('click', function () {
        copyText(raw, copyBtn);
      });
      toolbar.appendChild(copyBtn);
      container.appendChild(toolbar);

      parseSections(raw).forEach(function (sec) {
        container.appendChild(renderSection(sec));
      });
    }

    function renderError(container, message) {
      container.innerHTML = '';
      const err = makeEl('div', 'result-error', message);
      container.appendChild(err);
    }

    // 复制到剪贴板（带降级方案）
    function copyText(text, btn) {
      const done = function () {
        btn.textContent = '✅ 已复制';
        setTimeout(function () { btn.textContent = '📋 复制文案'; }, 1600);
      };
      const fallback = function () {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          done();
        } catch (e) {
          btn.textContent = '❌ 复制失败';
        }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else {
        fallback();
      }
    }

    /* =========================================================
       6. 生成入口
       ========================================================= */
    function wireGenerate(btnId, outputId, getInput, getSystem) {
      const btn = document.getElementById(btnId);
      const output = document.getElementById(outputId);
      if (!btn || !output) return;

      btn.addEventListener('click', async function () {
        const input = getInput();
        if (!input) {
          renderError(output, '⚠️ 请先输入产品卖点。');
          return;
        }

        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = '⏳ AI 生成中，请稍候…';
        output.innerHTML = '';

        try {
          if (!API_KEY) {
            output.innerHTML = '<div style="margin-top:20px; padding:15px; background:rgba(255,200,100,0.1); border-radius:8px; text-align:center; color:#f0e6d3;">🛡️ 当前处于「演示模式」。因为 API 密钥已隐藏，无法生成文案。请在本地填入真实密钥体验。</div>';
            return;
          }
          const raw = await callDeepSeek(getSystem(), input);
     
          renderResult(output, raw);
        } catch (err) {
          renderError(output, err.message || '生成失败，请重试。');
        } finally {
          btn.disabled = false;
          btn.textContent = original;
        }
      });
    }

        const selling = document.getElementById('overseas-input').value.trim();
        if (!selling) return '';
        return 'Target platform: ' + platform + '\n\nProduct selling points (in Chinese):\n' + selling;
      },
      function () { return PROMPTS.overseasSystem; }
    );
