<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 DeepSeek AI 助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050816;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        @media (pointer: fine) {
            body.meteor-cursor,
            body.meteor-cursor a,
            body.meteor-cursor button,
            body.meteor-cursor input {
                cursor: none !important;
            }
        }

        #starfield {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            display: block;
            background: radial-gradient(ellipse at bottom, #0b1a3a 0%, #050816 70%);
        }

        #meteor-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            pointer-events: none;
            display: block;
        }

        /* 左上角「返回首页」毛玻璃按钮（与 glass-panel 同一套星空质感） */
        .back-home-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(18, 28, 58, 0.45);
            border: 1px solid rgba(232, 200, 122, 0.28);
            box-shadow:
                0 0 40px rgba(120, 90, 255, 0.18),
                0 25px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(22px) saturate(1.4);
            -webkit-backdrop-filter: blur(22px) saturate(1.4);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-decoration: none;
            transition: transform 0.15s ease-out, box-shadow 0.25s ease;
        }

        .back-home-btn:hover {
            transform: translateY(-1px);
            box-shadow:
                0 0 55px rgba(200, 160, 255, 0.28),
                0 30px 70px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);
        }

        .back-home-btn:active { transform: translateY(1px); }

        .back-home-btn .arrow {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .back-home-btn:hover .arrow { transform: translateX(-3px); }

        .page-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            perspective: 1200px;
        }

        .glass-panel {
            width: min(680px, 100%);
            max-height: min(860px, 92vh);
            padding: 32px 28px;
            border-radius: 24px;
            background: rgba(18, 28, 58, 0.45);
            border: 1px solid rgba(232, 200, 122, 0.28);
            box-shadow:
                0 0 40px rgba(120, 90, 255, 0.18),
                0 25px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(22px) saturate(1.4);
            -webkit-backdrop-filter: blur(22px) saturate(1.4);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .glass-panel:hover {
            box-shadow:
                0 0 55px rgba(200, 160, 255, 0.28),
                0 30px 70px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);
        }

        .gradient-text {
            background: linear-gradient(120deg, #e8c87a 0%, #f5e6c8 40%, #e8eef8 70%, #c9d4e8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-align: center;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.75;
            margin-bottom: 6px;
        }

        #chat-box {
            flex: 1;
            min-height: 320px;
            max-height: 480px;
            overflow-y: auto;
            padding: 16px;
            border-radius: 16px;
            background: rgba(8, 14, 32, 0.45);
            border: 1px solid rgba(232, 200, 122, 0.18);
            box-shadow: inset 0 0 30px rgba(80, 60, 160, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        #chat-box::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-track { background: transparent; }
        #chat-box::-webkit-scrollbar-thumb {
            background: rgba(232, 200, 122, 0.35);
            border-radius: 3px;
        }

        .msg {
            margin: 12px 0;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.92rem;
            line-height: 1.55;
            color: #f0e8d8;
        }

        .user {
            background: linear-gradient(135deg, rgba(232, 200, 122, 0.22), rgba(200, 160, 255, 0.18));
            border: 1px solid rgba(232, 200, 122, 0.3);
            text-align: right;
            margin-left: 18%;
            box-shadow: 0 0 16px rgba(232, 200, 122, 0.08);
        }

        .ai {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(200, 180, 255, 0.22);
            text-align: left;
            margin-right: 10%;
            box-shadow: 0 0 16px rgba(160, 140, 255, 0.08);
        }

        .ai strong {
            background: linear-gradient(120deg, #e8c87a, #f5e6c8, #e8eef8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .demo-tip {
            text-align: center;
            font-size: 0.82rem;
            line-height: 1.55;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(232, 200, 122, 0.22);
            background-image: linear-gradient(120deg, rgba(232, 200, 122, 0.85) 0%, rgba(245, 230, 200, 0.9) 40%, rgba(232, 238, 248, 0.75) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex-shrink: 0;
        }

        .input-area {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(232, 200, 122, 0.3);
            background: rgba(8, 14, 32, 0.55);
            color: #f5e6c8;
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(8px);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder { color: rgba(232, 200, 122, 0.45); }

        input:focus {
            border-color: rgba(232, 200, 122, 0.65);
            box-shadow: 0 0 18px rgba(232, 200, 122, 0.18);
        }

        .send-btn {
            padding: 12px 22px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #c9a04a, #e8c87a 40%, #f0e0b8);
            color: #1a1230;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(232, 200, 122, 0.35);
            transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
            white-space: nowrap;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
            box-shadow: 0 0 28px rgba(232, 200, 122, 0.5);
        }

        .send-btn:active { transform: translateY(1px); }

        .email-block {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(232, 200, 122, 0.25);
            border-radius: 10px;
            padding: 14px;
            margin: 12px 0;
            backdrop-filter: blur(6px);
        }

        .email-block pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0 0 12px 0;
            font-family: inherit;
            font-size: 0.88rem;
            color: #f0e8d8;
            line-height: 1.6;
        }

        .copy-btn {
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, rgba(80, 200, 140, 0.85), rgba(60, 170, 120, 0.9));
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(80, 200, 140, 0.25);
            transition: filter 0.2s, background 0.2s;
        }

        .copy-btn:hover { filter: brightness(1.12); }
        .copy-btn.copied {
            background: linear-gradient(135deg, #6c757d, #868e96);
            box-shadow: none;
        }

        @media (max-width: 600px) {
            .back-home-btn { top: 12px; left: 12px; padding: 8px 14px; font-size: 0.85rem; }
            .glass-panel { padding: 22px 16px; border-radius: 18px; }
            h1 { font-size: 1.35rem; }
            #chat-box { min-height: 260px; max-height: 55vh; }
            .user { margin-left: 8%; }
            .ai { margin-right: 4%; }
            .input-area { flex-direction: column; }
            .demo-tip { font-size: 0.75rem; padding: 8px 10px; }
        }
    </style>
</head>
<body class="meteor-cursor">
    <canvas id="starfield"></canvas>
    <canvas id="meteor-canvas"></canvas>

    <!-- 左上角：返回首页毛玻璃按钮 -->
    <a href="index.html" class="back-home-btn gradient-text" aria-label="返回首页">
        <span class="arrow">←</span>返回首页
    </a>

    <div class="page-wrap">
        <div class="glass-panel" id="glass-panel">
            <h1 class="gradient-text">✨ 我的 AI 小助手</h1>
            <p class="subtitle gradient-text">商务英语邮件 · DeepSeek</p>
            <div id="chat-box"></div>
            <p class="demo-tip">🔒 演示模式：API密钥已隐藏，仅供展示视觉效果。如需测试AI功能，请在本地填入您的真实DeepSeek API密钥。</p>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="输入你想问 AI 的问题..." />
                <button class="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 关键步骤：现在就把这里替换成你真实的 DeepSeek API 密钥
        const API_KEY = ""

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderEmailBlocks(reply) {
            const parts = reply.split(/\n?---+\n?/).map(p => p.trim()).filter(Boolean);
            if (parts.length === 0) {
                return `<div class="msg ai">DeepSeek：${escapeHtml(reply)}</div>`;
            }

            let html = '<div class="msg ai"><strong>DeepSeek：</strong>';
            parts.forEach((part, index) => {
                const id = `email-${Date.now()}-${index}`;
                html += `
                    <div class="email-block">
                        <pre id="${id}">${escapeHtml(part)}</pre>
                        <button class="copy-btn" onclick="copyEmail('${id}', this)">一键复制</button>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        async function copyEmail(elementId, btn) {
            const text = document.getElementById(elementId).textContent;
            try {
                await navigator.clipboard.writeText(text);
                const original = btn.textContent;
                btn.textContent = '已复制 ✓';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 1500);
            } catch (err) {
                console.error('复制失败:', err);
                alert('复制失败，请手动选择文本复制。');
            }
        }

        async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    const chatBox = document.getElementById('chat-box');
    chatBox.innerHTML += `<div class="msg user">你: ${escapeHtml(text)}</div>`;
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // ——— 核心拦截：放在实际请求之前 ———
    if (!API_KEY || !API_KEY.startsWith('sk-')) {
        console.log("✅ 聊天拦截成功！演示模式被触发。");
        const demoNotice = `
            <div style="margin-top: 20px; padding: 15px; background: rgba(255, 200, 100, 0.1); border: 1px solid rgba(255, 200, 100, 0.3); border-radius: 8px; text-align: center; color: #f0e6d3;">
                🛡️ 当前处于「演示模式」。<br>
                因为 API 密钥已隐藏，所以无法在线上直接生成外贸邮件。<br>
                <span style="font-size: 0.9rem; opacity: 0.8;">如需测试，请在本地 Cursor 填入真实密钥，或通过浏览器控制台注入密钥。</span>
            </div>
        `;
        chatBox.innerHTML += demoNotice;
        return; // 走到这里就不会再执行 try 发请求了
    }

    // 调用 DeepSeek API
    try {
        const response = await fetch("https://api.deepseek.com/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: "deepseek-v4-flash",
                messages: [
                    { role: "system", content: "你是一个专业的商务英语邮件撰写助手。用户会用中文给你提供邮件意图，你需要根据意图，自动生成三版语气不同（正式、热情、简洁）的英文商务邮件。返回时直接用英文写出这三封邮件，用分隔线把三封隔开，不需要加多余的废话。" },
                    { role: "user", content: text }
                ],
                stream: false
            })
        });

        const data = await response.json();
        const reply = data.choices[0].message.content;
        chatBox.innerHTML += renderEmailBlocks(reply);
        chatBox.scrollTop = chatBox.scrollHeight;

    } catch (error) {
        console.warn("请求出现异常：", error);
        // 换成不会有中文报错的安全演示提示
        chatBox.innerHTML += `<div style="margin-top: 20px; padding: 15px; background: rgba(255, 200, 100, 0.1); border: 1px solid rgba(255, 200, 100, 0.3); border-radius: 8px; text-align: center; color: #f0e6d3;">
            🛡️ 当前处于「演示模式」。<br>
            因为 API 密钥已隐藏，所以无法在线上生成外贸邮件。
        </div>`;
    }
}

        // 按回车键也可以发送
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        /* ========== 深蓝动态星空粒子 ========== */
        (function initStarfield() {
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            let w, h, stars = [], shooting = [];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }

            function createStars() {
                stars = [];
                const count = Math.min(220, Math.floor((w * h) / 9000));
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        r: Math.random() * 1.6 + 0.3,
                        a: Math.random(),
                        speed: Math.random() * 0.015 + 0.004,
                        twinkle: Math.random() * Math.PI * 2
                    });
                }
            }

            function spawnShooting() {
                if (Math.random() > 0.985) {
                    shooting.push({
                        x: Math.random() * w,
                        y: Math.random() * h * 0.4,
                        len: Math.random() * 80 + 60,
                        speed: Math.random() * 8 + 6,
                        angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
                        life: 1
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                const grd = ctx.createRadialGradient(w * 0.5, h, 0, w * 0.5, h, h);
                grd.addColorStop(0, 'rgba(20, 40, 90, 0.35)');
                grd.addColorStop(1, 'rgba(5, 8, 22, 0)');
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, w, h);

                for (const s of stars) {
                    s.twinkle += s.speed;
                    const alpha = 0.35 + Math.sin(s.twinkle) * 0.45;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(230, 220, 255, ${alpha})`;
                    ctx.fill();
                }

                spawnShooting();
                for (let i = shooting.length - 1; i >= 0; i--) {
                    const m = shooting[i];
                    const dx = Math.cos(m.angle) * m.len;
                    const dy = Math.sin(m.angle) * m.len;
                    const g = ctx.createLinearGradient(m.x, m.y, m.x + dx, m.y + dy);
                    g.addColorStop(0, `rgba(255, 255, 255, ${m.life})`);
                    g.addColorStop(0.4, `rgba(200, 180, 255, ${m.life * 0.6})`);
                    g.addColorStop(1, 'rgba(100, 80, 200, 0)');
                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(m.x + dx, m.y + dy);
                    ctx.strokeStyle = g;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    m.x += Math.cos(m.angle) * m.speed;
                    m.y += Math.sin(m.angle) * m.speed;
                    m.life -= 0.018;
                    if (m.life <= 0) shooting.splice(i, 1);
                }

                requestAnimationFrame(draw);
            }

            window.addEventListener('resize', () => { resize(); createStars(); });
            resize();
            createStars();
            draw();
        })();

        /* ========== 发光流星拖尾光标 ========== */
        (function initMeteorCursor() {
            if (!window.matchMedia('(pointer: fine)').matches) return;

            const canvas = document.getElementById('meteor-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            const trail = [];
            const MAX = 22;
            let mx = -100, my = -100;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resize);
            resize();

            document.addEventListener('mousemove', (e) => {
                mx = e.clientX;
                my = e.clientY;
                trail.push({ x: mx, y: my, life: 1 });
                if (trail.length > MAX) trail.shift();
            });

            document.addEventListener('mouseleave', () => {
                mx = -100;
                my = -100;
                trail.length = 0;
            });

            function draw() {
                ctx.clearRect(0, 0, w, h);

                for (let i = 0; i < trail.length; i++) {
                    const t = trail[i];
                    const p = i / trail.length;
                    const r = 2 + p * 5;
                    t.life *= 0.92;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(232, 200, 122, ${t.life * p * 0.55})`;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = 'rgba(200, 160, 255, 0.8)';
                    ctx.fill();
                }

                if (mx > 0) {
                    ctx.beginPath();
                    ctx.arc(mx, my, 5, 0, Math.PI * 2);
                    const g = ctx.createRadialGradient(mx, my, 0, mx, my, 14);
                    g.addColorStop(0, 'rgba(255, 245, 220, 1)');
                    g.addColorStop(0.4, 'rgba(232, 200, 122, 0.85)');
                    g.addColorStop(1, 'rgba(180, 140, 255, 0)');
                    ctx.fillStyle = g;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = 'rgba(232, 200, 122, 0.9)';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(mx, my, 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 0;
                    ctx.fill();
                }

                while (trail.length && trail[0].life < 0.05) trail.shift();
                requestAnimationFrame(draw);
            }

            draw();
        })();

        /* ========== 3D 视差悬浮效果 ========== */
        (function initParallax() {
            const panel = document.getElementById('glass-panel');
            if (!window.matchMedia('(pointer: fine)').matches) return;

            let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0;

            document.addEventListener('mousemove', (e) => {
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                targetRY = ((e.clientX - cx) / cx) * 8;
                targetRX = ((cy - e.clientY) / cy) * 6;
            });

            document.addEventListener('mouseleave', () => {
                targetRX = 0;
                targetRY = 0;
            });

            function animate() {
                curRX += (targetRX - curRX) * 0.08;
                curRY += (targetRY - curRY) * 0.08;
                panel.style.transform =
                    `rotateX(${curRX.toFixed(2)}deg) rotateY(${curRY.toFixed(2)}deg) translateZ(0)`;
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>
