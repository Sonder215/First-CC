<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 DeepSeek AI 助手</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 8px; background: #f9f9f9;}
        .msg { margin: 10px 0; padding: 8px 12px; border-radius: 6px; }
        .user { background: #d1e7ff; text-align: right; }
        .ai { background: #e9ecef; text-align: left; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .email-block { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin: 10px 0; }
        .email-block pre { white-space: pre-wrap; word-wrap: break-word; margin: 0 0 10px 0; font-family: inherit; font-size: 14px; }
        .copy-btn { padding: 6px 12px; font-size: 13px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .copy-btn:hover { background: #218838; }
        .copy-btn.copied { background: #6c757d; }
    </style>
</head>
<body>
    <h1>✨ 我的 AI 小助手</h1>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="输入你想问 AI 的问题..." />
        <button onclick="sendMessage()">发送</button>
    </div>

    <script>
        // ⚠️ 关键步骤：现在就把这里替换成你真实的 DeepSeek API 密钥
        const API_KEY = "请在这里填入你的真实 DeepSeek 密钥"

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function renderEmailBlocks(reply) {
            const parts = reply.split(/\n?---+\n?/).map(p => p.trim()).filter(Boolean);
            if (parts.length === 0) {
                return `<div class="msg ai">DeepSeek：${escapeHtml(reply)}</div>`;
            }

            let html = '<div class="msg ai"><strong>DeepSeek：</strong>';
            parts.forEach((part, index) => {
                const id = `email-${Date.now()}-${index}`;
                html += `
                    <div class="email-block">
                        <pre id="${id}">${escapeHtml(part)}</pre>
                        <button class="copy-btn" onclick="copyEmail('${id}', this)">一键复制</button>
                    </div>
                `;
            });
            html += '</div>';
            return html;
        }

        async function copyEmail(elementId, btn) {
            const text = document.getElementById(elementId).textContent;
            try {
                await navigator.clipboard.writeText(text);
                const original = btn.textContent;
                btn.textContent = '已复制 ✓';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 1500);
            } catch (err) {
                console.error('复制失败:', err);
                alert('复制失败，请手动选择文本复制。');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="msg user">你：${escapeHtml(text)}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 调用 DeepSeek API
            try {
                const response = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat", 
                        messages: [
    { role: "system", content: "你是一个专业的商务英语邮件撰写助手。用户会用中文给你提供邮件意图，你需要根据意图，自动生成三版语气不同（正式、热情、简洁）的英文商务邮件。返回时直接用英文写出这三封邮件，用分隔线把三封隔开，不需要加多余的废话。" },
    { role: "user", content: text }
],
                        stream: false
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;
                chatBox.innerHTML += renderEmailBlocks(reply);
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div class="msg ai" style="color:red;">请求失败，请检查 API 密钥是否正确或网络是否通畅。</div>`;
                console.error(error);
            }
        }

        // 按回车键也可以发送
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
