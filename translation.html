<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 同传 · 实时语音翻译</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050816;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 隐藏系统光标：由流星光标替代（仅鼠标设备） */
        @media (pointer: fine) {
            html,
            body.meteor-cursor,
            body.meteor-cursor a,
            body.meteor-cursor button,
            body.meteor-cursor input {
                cursor: none !important;
            }
        }

        #starfield {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            display: block;
            background: radial-gradient(ellipse at bottom, #0b1a3a 0%, #050816 70%);
        }

        /* 流星光标画布：铺满全屏、置顶但不拦截任何点击 */
        #meteor-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            display: block;
        }

        /* 左上角「返回首页」毛玻璃按钮（与主页同一套星空质感） */
        .back-home-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(18, 28, 58, 0.45);
            border: 1px solid rgba(232, 200, 122, 0.28);
            box-shadow:
                0 0 40px rgba(120, 90, 255, 0.18),
                0 25px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(22px) saturate(1.4);
            -webkit-backdrop-filter: blur(22px) saturate(1.4);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-decoration: none;
            transition: transform 0.15s ease-out, box-shadow 0.25s ease;
        }

        .back-home-btn:hover {
            transform: translateY(-1px);
            box-shadow:
                0 0 55px rgba(200, 160, 255, 0.28),
                0 30px 70px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);
        }

        .back-home-btn:active { transform: translateY(1px); }

        .back-home-btn .arrow {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .back-home-btn:hover .arrow { transform: translateX(-3px); }

        .page-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            perspective: 1200px;
        }

        .glass-panel {
            width: min(680px, 100%);
            max-height: min(860px, 92vh);
            padding: 32px 28px;
            border-radius: 24px;
            background: rgba(18, 28, 58, 0.45);
            border: 1px solid rgba(232, 200, 122, 0.28);
            box-shadow:
                0 0 40px rgba(120, 90, 255, 0.18),
                0 25px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(22px) saturate(1.4);
            -webkit-backdrop-filter: blur(22px) saturate(1.4);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .glass-panel:hover {
            box-shadow:
                0 0 55px rgba(200, 160, 255, 0.28),
                0 30px 70px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.16);
        }

        .glass-panel::-webkit-scrollbar { width: 5px; }
        .glass-panel::-webkit-scrollbar-track { background: transparent; }
        .glass-panel::-webkit-scrollbar-thumb {
            background: rgba(232, 200, 122, 0.35);
            border-radius: 3px;
        }

        .gradient-text {
            background: linear-gradient(120deg, #e8c87a 0%, #f5e6c8 40%, #e8eef8 70%, #c9d4e8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-align: center;
            margin-bottom: 0;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.75;
            margin-bottom: 0;
        }

        /* —— 翻译方向切换：英译中 / 中译英 —— */
        .direction-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 2px;
        }

        .direction-switch button {
            padding: 9px 22px;
            border-radius: 999px;
            border: 1px solid rgba(232, 200, 122, 0.3);
            background: rgba(8, 14, 32, 0.5);
            color: rgba(245, 230, 200, 0.75);
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            user-select: none;
        }

        .direction-switch button:hover {
            border-color: rgba(232, 200, 122, 0.55);
            color: #f5e6c8;
        }

        .direction-switch button.active {
            background: linear-gradient(135deg, #c9a04a, #e8c87a 40%, #f0e0b8);
            color: #1a1230;
            border-color: rgba(240, 224, 184, 0.7);
            box-shadow: 0 0 20px rgba(232, 200, 122, 0.35);
        }

        /* —— 麦克风按钮 —— */
        .mic-wrap {
            display: flex;
            justify-content: center;
            margin-top: 2px;
        }

        .mic-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 112px;
            height: 112px;
            border-radius: 50%;
            border: 1px solid rgba(232, 200, 122, 0.35);
            background: radial-gradient(circle at 50% 38%,
                rgba(255, 245, 220, 0.16) 0%,
                rgba(120, 90, 255, 0.10) 55%,
                rgba(18, 28, 58, 0.35) 100%);
            font-size: 2.5rem;
            line-height: 1;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow:
                0 0 30px rgba(232, 200, 122, 0.28),
                0 15px 35px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
            transition: transform 0.15s ease-out, box-shadow 0.25s ease, border-color 0.25s ease;
            user-select: none;
        }

        .mic-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow:
                0 0 45px rgba(232, 200, 122, 0.45),
                0 18px 40px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
        }

        .mic-btn:active { transform: scale(0.95); }

        .mic-btn.listening {
            border-color: rgba(255, 130, 140, 0.65);
            background: radial-gradient(circle at 50% 38%,
                rgba(255, 200, 200, 0.18) 0%,
                rgba(255, 90, 120, 0.14) 55%,
                rgba(40, 20, 60, 0.4) 100%);
            animation: micPulse 1.8s ease-out infinite;
        }

        @keyframes micPulse {
            0%   { box-shadow: 0 0 0 0 rgba(255, 110, 130, 0.5), 0 0 34px rgba(255, 110, 130, 0.45); }
            70%  { box-shadow: 0 0 0 26px rgba(255, 110, 130, 0), 0 0 34px rgba(255, 110, 130, 0.45); }
            100% { box-shadow: 0 0 0 0 rgba(255, 110, 130, 0), 0 0 34px rgba(255, 110, 130, 0.45); }
        }

        .mic-status {
            text-align: center;
            font-size: 0.82rem;
            color: rgba(245, 230, 200, 0.6);
            min-height: 1.3em;
            transition: color 0.25s ease;
        }

        .mic-status.listening { color: #ff9aa4; }

        /* —— 语音 / 翻译框 —— */
        .box-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: -8px;
        }

        .box-label {
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            color: rgba(245, 230, 200, 0.7);
        }

        .clear-btn {
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid rgba(232, 200, 122, 0.25);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(245, 230, 200, 0.7);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .speech-box, .translate-box {
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(8, 14, 32, 0.45);
            border: 1px solid rgba(232, 200, 122, 0.18);
            box-shadow: inset 0 0 30px rgba(80, 60, 160, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-size: 0.95rem;
            line-height: 1.6;
            color: #f0e8d8;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-y: auto;
        }

        .speech-box {
            min-height: 56px;
            max-height: 110px;
            flex-shrink: 0;
        }

        .translate-box {
            flex: 1;
            min-height: 90px;
            max-height: 190px;
        }

        .speech-box::-webkit-scrollbar, .translate-box::-webkit-scrollbar { width: 5px; }
        .speech-box::-webkit-scrollbar-track, .translate-box::-webkit-scrollbar-track { background: transparent; }
        .speech-box::-webkit-scrollbar-thumb, .translate-box::-webkit-scrollbar-thumb {
            background: rgba(232, 200, 122, 0.35);
            border-radius: 3px;
        }

        .speech-box:empty::before {
            content: "点击麦克风，开始说话…";
            color: rgba(245, 230, 200, 0.35);
        }

        .translate-box:empty::before {
            content: "翻译结果将显示在这里…";
            color: rgba(245, 230, 200, 0.35);
        }

        .translating-hint {
            color: rgba(245, 230, 200, 0.55);
            font-size: 0.9rem;
        }

        /* —— 隐私提示：醒目 —— */
        .privacy-note {
            flex-shrink: 0;
            text-align: center;
            font-size: 0.84rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 176, 84, 0.4);
            background: rgba(255, 160, 70, 0.1);
            color: #ffd9a3;
            text-shadow: 0 0 12px rgba(255, 180, 100, 0.35);
            box-shadow: 0 0 18px rgba(255, 150, 60, 0.12);
        }

        @media (max-width: 600px) {
            .back-home-btn { top: 12px; left: 12px; padding: 8px 14px; font-size: 0.85rem; }
            .glass-panel { padding: 22px 16px; border-radius: 18px; }
            h1 { font-size: 1.35rem; }
            .direction-switch { gap: 8px; }
            .direction-switch button { padding: 8px 14px; font-size: 0.85rem; }
            .mic-btn { width: 92px; height: 92px; font-size: 2rem; }
            .speech-box { min-height: 52px; max-height: 96px; }
            .translate-box { min-height: 80px; max-height: 150px; }
            .privacy-note { font-size: 0.76rem; }
        }
    </style>
</head>
<body class="meteor-cursor">
    <canvas id="starfield"></canvas>

    <!-- 左上角：返回首页毛玻璃按钮 -->
    <a href="index.html" class="back-home-btn gradient-text" aria-label="返回首页">
        <span class="arrow">←</span>返回首页
    </a>

    <div class="page-wrap">
        <div class="glass-panel" id="glass-panel">
            <h1 class="gradient-text">🔊 AI 同传助手</h1>
            <p class="subtitle gradient-text">实时语音翻译 · 中英双向同传</p>

            <!-- 翻译方向：英译中 / 中译英 -->
            <div class="direction-switch" role="group" aria-label="翻译方向">
                <button type="button" id="dir-en2zh" class="active">🇬🇧 英译中</button>
                <button type="button" id="dir-zh2en">🇨🇳 中译英</button>
            </div>

            <!-- 麦克风按钮 -->
            <div class="mic-wrap">
                <button class="mic-btn" id="mic-btn" type="button" aria-label="开始或停止语音识别">🎤</button>
            </div>
            <p class="mic-status" id="mic-status" aria-live="polite">点击麦克风开始说话</p>

            <!-- 原始语音 -->
            <div class="box-head">
                <span class="box-label">📝 原始语音</span>
                <button class="clear-btn" id="clear-btn" type="button">清空</button>
            </div>
            <div class="speech-box" id="speech-box"></div>

            <!-- 翻译结果 -->
            <div class="box-head">
                <span class="box-label">🌐 翻译结果</span>
            </div>
            <div class="translate-box" id="translate-box"></div>

            <!-- 隐私提示 -->
            <p class="privacy-note">🔒 您的语音数据将发送至云端识别，请勿输入敏感信息。</p>
        </div>
    </div>

    <!-- 流星拖尾画布：页面底部、最上层（pointer-events: none，不阻挡按钮点击） -->
    <canvas id="meteor-canvas" aria-hidden="true"></canvas>

    <script>
        // ⚠️ 关键步骤：现在就把这里替换成你真实的 DeepSeek API 密钥
        const API_KEY = "";

        /* ========== 语音识别 + 自动翻译 ========== */
        (function initTranslator() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            const micBtn = document.getElementById('mic-btn');
            const micStatus = document.getElementById('mic-status');
            const speechBox = document.getElementById('speech-box');
            const translateBox = document.getElementById('translate-box');
            const dirEn2zh = document.getElementById('dir-en2zh');
            const dirZh2en = document.getElementById('dir-zh2en');
            const clearBtn = document.getElementById('clear-btn');
            
            let direction = 'en2zh';
            let recognition = null;
            let isListening = false;
            let shouldRestart = false;
            let lastError = '';
            let finalText = '';
            let interimText = '';
            let lastTranslated = 0;
            let silenceTimer = null;
            let translating = false;
            let sessionId = 0;

            function setStatus(msg, listening) {
                micStatus.textContent = msg;
                micStatus.classList.toggle('listening', !!listening);
            }

            // 原始语音框：最终文本 + 实时中间结果，逐字显示
            function refreshSpeechBox() {
                speechBox.textContent = finalText + interimText;
                speechBox.scrollTop = speechBox.scrollHeight;
            }

            function resetSession() {
                sessionId++;            // 丢弃尚在途中的过期翻译
                clearTimeout(silenceTimer);
                finalText = '';
                interimText = '';
                lastTranslated = 0;
                speechBox.textContent = '';
                translateBox.textContent = '';
                setStatus('点击麦克风开始说话', false);
            }

            function demoNoticeHtml() {
                return `
                    <div style="margin-top:4px;padding:12px;background:rgba(255,200,100,0.1);border:1px solid rgba(255,200,100,0.3);border-radius:8px;text-align:center;color:#f0e6d3;font-size:0.88rem;line-height:1.6;">
                        🛡️ 当前处于「演示模式」。<br>
                        因为 API 密钥已隐藏，所以无法在线上真实翻译。<br>
                        <span style="font-size:0.8rem;opacity:0.8;">如需测试，请在本地填入真实 DeepSeek API 密钥。</span>
                    </div>
                `;
            }

            // 把自上次翻译以来新识别出的文字发给 DeepSeek
            async function translateNow() {
                const text = finalText.trim();
                if (!text || text.length <= lastTranslated || translating) return;

                translating = true;
                lastTranslated = text.length;
                const mySession = sessionId;
                const myDirection = direction;

                translateBox.innerHTML = '<span class="translating-hint">⏳ 正在翻译…</span>';

                try {
                    // ——— 核心拦截：放在实际请求之前 ———
                    if (!API_KEY || !API_KEY.startsWith('sk-')) {
                        console.log("✅ 翻译拦截成功！演示模式被触发。");
                        translateBox.innerHTML = demoNoticeHtml();
                        return;
                    }

                    // 调用 DeepSeek API
                    const response = await fetch("https://api.deepseek.com/chat/completions", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${API_KEY}`
                        },
                        body: JSON.stringify({
                            model: "deepseek-v4-flash",
                            messages: [
                                {
                                    role: "system",
                                    content: myDirection === 'en2zh'
                                        ? "你是一名专业的同声传译。请把用户输入的英文语音识别文本翻译成自然、地道、简洁的中文，直接输出译文，不要添加任何解释、前缀或引号。"
                                        : "你是一名专业的同声传译。请把用户输入的中文语音识别文本翻译成自然、地道、简洁的英文，直接输出译文，不要添加任何解释、前缀或引号。"
                                },
                                { role: "user", content: text }
                            ],
                            stream: false
                        })
                    });

                    const data = await response.json();
                    const reply = data.choices[0].message.content;
                    if (mySession !== sessionId) return; // 会话已清空/切换方向，丢弃过期结果
                    translateBox.textContent = reply;
                } catch (error) {
                    console.warn("请求出现异常：", error);
                    if (mySession === sessionId) translateBox.innerHTML = demoNoticeHtml();
                } finally {
                    translating = false;
                    // 翻译期间若又识别到新语音，立即补翻新的一段
                    if (finalText.trim().length > lastTranslated) translateNow();
                }
            }

            // 每收到一句新语音就重置停顿计时；停顿约 2.2 秒视为"一句话说完"，立即翻译
            function scheduleTranslate() {
                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    if (!finalText.trim()) return;
                    translateNow();
                }, 2200);
            }

            function getRecognition() {
                if (!SpeechRecognition) return null;
                if (recognition) return recognition;

                recognition = new SpeechRecognition();
                recognition.continuous = true;      // 持续聆听，实现同传
                recognition.interimResults = true;  // 实时逐字中间结果
                recognition.lang = direction === 'en2zh' ? 'en-US' : 'zh-CN';

                recognition.onstart = () => {
                    lastError = '';
                    isListening = true;
                    micBtn.classList.add('listening');
                    setStatus(direction === 'en2zh'
                        ? '🎙️ 正在聆听英文…请开始说话'
                        : '🎙️ 正在聆听中文…请开始说话', true);
                };

                recognition.onresult = (event) => {
                    let interim = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const result = event.results[i];
                        if (result.isFinal) {
                            finalText += result[0].transcript;
                        } else {
                            interim += result[0].transcript;
                        }
                    }
                    interimText = interim;
                    refreshSpeechBox();   // 逐字实时显示
                    scheduleTranslate();  // 重置停顿计时
                };

                recognition.onerror = (event) => {
                    console.warn('语音识别错误：', event.error);
                    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                        lastError = '⛔ 麦克风权限被拒绝，请在浏览器设置中允许使用麦克风';
                        shouldRestart = false;
                    } else if (event.error === 'no-speech') {
                        lastError = '🤫 未检测到语音，请再试一次';
                    } else if (event.error === 'network') {
                        lastError = '📡 网络错误：语音识别需要联网';
                        shouldRestart = false;
                    } else if (event.error === 'aborted') {
                        lastError = '';
                    } else {
                        lastError = '⚠️ 识别出错：' + event.error;
                        shouldRestart = false;
                    }
                    setStatus(lastError, false);
                };

                recognition.onend = () => {
                    isListening = false;
                    micBtn.classList.remove('listening');
                    translateNow(); // 识别暂停或结束 → 自动翻译最后一段

                    if (shouldRestart) {
                        // Chrome 连续识别超时自动停止后重启，实现长时间同传
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {
                                console.warn('重启识别失败：', e);
                            }
                        }, 250);
                    } else {
                        setStatus(lastError || '点击麦克风开始说话', false);
                    }
                };

                return recognition;
            }

            micBtn.addEventListener('click', () => {
                const rec = getRecognition();
                if (!rec) {
                    setStatus('⚠️ 当前浏览器不支持语音识别（webkitSpeechRecognition），请使用 Chrome / Edge', false);
                    return;
                }
                if (isListening) {
                    shouldRestart = false;
                    try { rec.stop(); } catch (e) {}
                } else {
                    shouldRestart = true;
                    try { rec.start(); } catch (e) {
                        console.warn('启动识别失败：', e);
                    }
                }
            });

            function setDirection(dir) {
                if (direction === dir) return;
                direction = dir;
                dirEn2zh.classList.toggle('active', dir === 'en2zh');
                dirZh2en.classList.toggle('active', dir === 'zh2en');
                if (recognition) recognition.lang = dir === 'en2zh' ? 'en-US' : 'zh-CN';
                resetSession();
                if (isListening && recognition) {
                    // 停止后 onend 会自动按新语言重启
                    try { recognition.stop(); } catch (e) {}
                }
            }

            dirEn2zh.addEventListener('click', () => setDirection('en2zh'));
            dirZh2en.addEventListener('click', () => setDirection('zh2en'));
            clearBtn.addEventListener('click', resetSession);

            // 离开页面前停止识别，避免浏览器后台继续收音
            window.addEventListener('beforeunload', () => {
                if (recognition && isListening) {
                    try { recognition.abort(); } catch (e) {}
                }
            });
        })();

        /* ========== 深蓝动态星空粒子 ========== */
        (function initStarfield() {
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            let w, h, stars = [], shooting = [];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }

            function createStars() {
                stars = [];
                const count = Math.min(220, Math.floor((w * h) / 9000));
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        r: Math.random() * 1.6 + 0.3,
                        a: Math.random(),
                        speed: Math.random() * 0.015 + 0.004,
                        twinkle: Math.random() * Math.PI * 2
                    });
                }
            }

            function spawnShooting() {
                if (Math.random() > 0.985) {
                    shooting.push({
                        x: Math.random() * w,
                        y: Math.random() * h * 0.4,
                        len: Math.random() * 80 + 60,
                        speed: Math.random() * 8 + 6,
                        angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
                        life: 1
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                const grd = ctx.createRadialGradient(w * 0.5, h, 0, w * 0.5, h, h);
                grd.addColorStop(0, 'rgba(20, 40, 90, 0.35)');
                grd.addColorStop(1, 'rgba(5, 8, 22, 0)');
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, w, h);

                for (const s of stars) {
                    s.twinkle += s.speed;
                    const alpha = 0.35 + Math.sin(s.twinkle) * 0.45;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(230, 220, 255, ${alpha})`;
                    ctx.fill();
                }

                spawnShooting();
                for (let i = shooting.length - 1; i >= 0; i--) {
                    const m = shooting[i];
                    const dx = Math.cos(m.angle) * m.len;
                    const dy = Math.sin(m.angle) * m.len;
                    const g = ctx.createLinearGradient(m.x, m.y, m.x + dx, m.y + dy);
                    g.addColorStop(0, `rgba(255, 255, 255, ${m.life})`);
                    g.addColorStop(0.4, `rgba(200, 180, 255, ${m.life * 0.6})`);
                    g.addColorStop(1, 'rgba(100, 80, 200, 0)');
                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(m.x + dx, m.y + dy);
                    ctx.strokeStyle = g;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    m.x += Math.cos(m.angle) * m.speed;
                    m.y += Math.sin(m.angle) * m.speed;
                    m.life -= 0.018;
                    if (m.life <= 0) shooting.splice(i, 1);
                }

                requestAnimationFrame(draw);
            }

            window.addEventListener('resize', () => { resize(); createStars(); });
            resize();
            createStars();
            draw();
        })();

        /* ========== 发光流星拖尾光标（主页同款：长渐变拖尾） ========== */
        (function initMeteorCursor() {
            if (!window.matchMedia('(pointer: fine)').matches) return;

            let canvas = document.getElementById('meteor-canvas');
            if (!canvas) {
                // 兜底：动态创建（正常情况下已存在于页面底部）
                canvas = document.createElement('canvas');
                canvas.id = 'meteor-canvas';
                canvas.setAttribute('aria-hidden', 'true');
                document.body.appendChild(canvas);
            }

            const ctx = canvas.getContext('2d', { alpha: true });
            if (!ctx) return;

            let cssW = 0, cssH = 0, dpr = 1;

            function resizeCanvas() {
                dpr = Math.max(1, window.devicePixelRatio || 1);
                cssW = window.innerWidth;
                cssH = window.innerHeight;
                canvas.width = Math.floor(cssW * dpr);
                canvas.height = Math.floor(cssH * dpr);
                canvas.style.width = cssW + 'px';
                canvas.style.height = cssH + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const trail = [];
            const MAX_TRAIL = 28;
            let mouseX = cssW / 2;
            let mouseY = cssH / 2;
            let targetX = mouseX;
            let targetY = mouseY;
            let mouseActive = false;

            document.addEventListener('mousemove', (e) => {
                targetX = e.clientX;
                targetY = e.clientY;
                mouseActive = true;
            }, { passive: true });

            document.documentElement.addEventListener('mouseleave', () => {
                mouseActive = false;
            });

            window.addEventListener('blur', () => {
                mouseActive = false;
            });

            function drawHead(x, y, alpha) {
                const a = Math.max(0, Math.min(1, alpha));
                const glow = ctx.createRadialGradient(x, y, 0, x, y, 14);
                glow.addColorStop(0, `rgba(255, 255, 255, ${0.95 * a})`);
                glow.addColorStop(0.25, `rgba(200, 220, 255, ${0.75 * a})`);
                glow.addColorStop(0.6, `rgba(140, 180, 255, ${0.28 * a})`);
                glow.addColorStop(1, 'rgba(100, 140, 255, 0)');

                ctx.beginPath();
                ctx.fillStyle = glow;
                ctx.shadowBlur = 18;
                ctx.shadowColor = `rgba(180, 210, 255, ${0.9 * a})`;
                ctx.arc(x, y, 14, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.shadowBlur = 6;
                ctx.fillStyle = `rgba(255, 255, 255, ${0.95 * a})`;
                ctx.arc(x, y, 2.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function drawMeteor() {
                // 缓动跟随鼠标位置，拖尾更顺滑
                mouseX += (targetX - mouseX) * 0.35;
                mouseY += (targetY - mouseY) * 0.35;

                if (mouseActive) {
                    trail.unshift({ x: mouseX, y: mouseY, life: 1 });
                    if (trail.length > MAX_TRAIL) trail.pop();
                }

                for (let i = trail.length - 1; i >= 0; i--) {
                    trail[i].life -= 0.045;
                    if (trail[i].life <= 0) trail.splice(i, 1);
                }

                ctx.clearRect(0, 0, cssW, cssH);

                // 长渐变拖尾：亮白 → 冰蓝 → 紫，逐段渐变描边
                if (trail.length >= 2) {
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    for (let i = 0; i < trail.length - 1; i++) {
                        const p0 = trail[i];
                        const p1 = trail[i + 1];
                        const t = i / trail.length;
                        const alpha = p0.life * (1 - t) * 0.85;
                        const width = (1 - t) * 6 + 0.5;

                        const g = ctx.createLinearGradient(p0.x, p0.y, p1.x, p1.y);
                        g.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
                        g.addColorStop(0.4, `rgba(180, 210, 255, ${alpha * 0.65})`);
                        g.addColorStop(1, `rgba(120, 100, 255, ${alpha * 0.1})`);

                        ctx.beginPath();
                        ctx.strokeStyle = g;
                        ctx.lineWidth = width;
                        ctx.shadowBlur = 12 * (1 - t);
                        ctx.shadowColor = `rgba(160, 190, 255, ${alpha * 0.75})`;
                        ctx.moveTo(p0.x, p0.y);
                        ctx.lineTo(p1.x, p1.y);
                        ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                }

                // 头部发光光点
                if (mouseActive) {
                    const head = trail[0];
                    drawHead(head ? head.x : mouseX, head ? head.y : mouseY, head ? head.life : 1);
                }

                requestAnimationFrame(drawMeteor);
            }
            requestAnimationFrame(drawMeteor);
        })();

        /* ========== 3D 视差悬浮效果 ========== */
        (function initParallax() {
            const panel = document.getElementById('glass-panel');
            if (!window.matchMedia('(pointer: fine)').matches) return;

            let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0;

            document.addEventListener('mousemove', (e) => {
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                targetRY = ((e.clientX - cx) / cx) * 8;
                targetRX = ((cy - e.clientY) / cy) * 6;
            });

            document.addEventListener('mouseleave', () => {
                targetRX = 0;
                targetRY = 0;
            });

            function animate() {
                curRX += (targetRX - curRX) * 0.08;
                curRY += (targetRY - curRY) * 0.08;
                panel.style.transform =
                    `rotateX(${curRX.toFixed(2)}deg) rotateY(${curRY.toFixed(2)}deg) translateZ(0)`;
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
